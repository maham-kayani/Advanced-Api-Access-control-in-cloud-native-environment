apiVersion: v1
kind: Namespace
metadata:
  name: uncontrolled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: uncontrolled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:25.0
        args: ["start-dev"]
        env:
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: uncontrolled
spec:
  selector:
    app: keycloak
  ports:
  - protocol: TCP
    port: 8081          # matches KEYCLOAK_URL=http://localhost:8081
    targetPort: 8080
  type: LoadBalancer
